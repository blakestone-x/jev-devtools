name: Isolated browser benchmark
on:
  pull_request:
    paths:
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      baseline:
        description: Git ref to compare against
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [stream, questions]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - name: Compare base and candidate on this VM
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
          BENCH_DRAWER_MODES: open,closed,unopened
          BENCH_SUITE: ${{ matrix.suite }}
          BENCH_SCENARIOS: ${{ matrix.suite == 'questions' && 'small,many-questions,mixed-questions' || 'max-history,combined' }}
        run: npm run bench:compare -- "$BASELINE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-browser-${{ matrix.suite }}-${{ github.run_id }}
          path: benchmarks/results/comparison/
          retention-days: 14
